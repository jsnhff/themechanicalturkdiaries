<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.layout == 'post' %}{{ page.title | escape }} - {{ site.title }}{% elsif page.title %}{{ site.title }}: {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.layout == 'post' %}{{ content | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.layout == 'post' %}{{ page.title | escape }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.layout == 'post' %}{{ content | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <link rel="icon" href="{{ '/images/avatar.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/avatar.jpg' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="preload" href="{{ '/fonts/EBGaramond.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/fonts/EBGaramond-Italic.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
</head>
<body>
  <div id="page">
    {% include header.html %}
    <div id="content">
      {{ content }}
    </div>
    {% include footer.html %}
  </div>
</body>
</html>
